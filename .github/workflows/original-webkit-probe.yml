name: Original WebKit Browser Probe
on:
  pull_request:
    paths:
      - ".github/workflows/original-webkit-probe.yml"
      - "scripts/browser-original-webkit-probe.mjs"
      - "scripts/browser-original-webkit-chain.mjs"
      - "scripts/inspect-original-button-placements.py"
      - "public/port-host.js"
      - "scripts/stage-original-gamezip.py"
  workflow_dispatch:
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Ruffle and Playwright WebKit
        run: |
          npm install --no-save @ruffle-rs/ruffle@0.7.1 playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps webkit
          mkdir -p public/ruffle
          cp -R node_modules/@ruffle-rs/ruffle/. public/ruffle/
      - name: Stage verified original SWFs privately
        run: |
          curl -fLsS --retry 1 --max-time 45 --max-filesize 12000000 \
            "https://download.unstable.life/gib-roms/Games/a8b2e1fb-e408-2f0f-b1b8-08537b0e864b-1747960890788.zip" \
            -o /tmp/the-house-original.zip
          python3 scripts/stage-original-gamezip.py /tmp/the-house-original.zip
          node scripts/check-staged-assets.mjs
      - name: Validate original DefineButton2 metadata privately
        run: |
          python3 scripts/inspect-original-button-placements.py /tmp/the-house-original.zip > /tmp/house-button-metadata.json
          python3 - <<'PY'
          import json
          with open('/tmp/house-button-metadata.json') as stream:
              report=json.load(stream)
          rooms=[f for f in report['files'] if f['file'].lower()=='dining room.swf']
          assert len(rooms)==1, 'Dining Room original not found'
          buttons=rooms[0]['buttonActionMetadata']
          assert buttons, 'Dining Room has no parsed DefineButton2 definitions'
          assert all(isinstance(b['hasConditionalActions'],bool) for b in buttons)
          print('Original Dining Room DefineButton2 metadata parsed:',len(buttons),'buttons')
          PY
      - name: Start localhost research host
        run: |
          npm run dev > /tmp/the-house-vite.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5173/port.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the-house-vite.log
          exit 1
      - name: Run genuine original game in WebKit
        run: node scripts/browser-original-webkit-probe.mjs
      - name: Explore original Corridor Kitchen Bathroom touch chain
        run: node scripts/browser-original-webkit-chain.mjs
      - name: Preserve diagnostics only, never game assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-webkit-metadata
          path: |
            original-webkit-metadata.json
            original-webkit-chain.json
          retention-days: 7
          if-no-files-found: warn
